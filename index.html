:root{
  --bg:#ffffff; --fg:#16181d; --muted:#667085; --line:#e6e8ec; --soft:#f6f7f9;
  --accent:#0b5fcc; --accent-ink:#ffffff; --accent-soft:#eaf1fc;
  --ok:#127a3a; --ok-soft:#e8f6ed; --bad:#b42318; --bad-soft:#fdeceb;
  --radius:14px;
}
/* ברירת מחדל בהירה. מצב כהה רק בלחיצה — לא לפי הגדרות המערכת */
:root[data-theme="dark"]{
  --bg:#0f1115; --fg:#eceef2; --muted:#9aa3b2; --line:#272b34; --soft:#171a21;
  --accent:#6ea8ff; --accent-ink:#0b1020; --accent-soft:#16233a;
  --ok:#4ade80; --ok-soft:#10261a; --bad:#f87171; --bad-soft:#2a1515;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Hebrew",Arial,sans-serif;
  font-size:17px; line-height:1.5; overflow-x:hidden;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px calc(96px + env(safe-area-inset-bottom))}
/* קטעים בשפה זרה — מבודדים כדי שהפיסוק לא יקפוץ */
.gr,.tr,.lat{unicode-bidi:isolate;direction:ltr}
.gr{font-weight:600;letter-spacing:.01em}
.tr{color:var(--muted);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.92em;letter-spacing:.02em}
.he{unicode-bidi:isolate}
.muted{color:var(--muted)}
.small{font-size:14px}
.wrapword{overflow-wrap:anywhere}

header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 10px}
header.top h1{font-family:"GTHe",system-ui,sans-serif;font-size:26px;margin:0;font-weight:400;flex:1;line-height:1.15;letter-spacing:.01em}
header.top h1 .gr{font-family:"GTGr",system-ui,sans-serif;color:var(--accent);font-weight:700;font-size:20px;display:inline-block;margin-inline-start:4px}
/* תמונות פרופיל בעיגול */
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;display:inline-flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:18px;overflow:hidden;border:2px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
.av.lg{width:64px;height:64px;font-size:26px}
.avbtn{border:none;background:none;padding:2px;min-width:48px;min-height:48px;display:inline-flex;align-items:center;justify-content:center}
.board .prow{display:flex;align-items:center;gap:10px;padding:8px 0}
.board .prow+.prow{border-top:1px solid var(--line)}
.board .prow.me .nm{color:var(--accent)}
.board .nm{font-weight:700}
.crown{font-size:18px}
.pcard{display:flex;gap:12px;align-items:center}
.pcard .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pcard .acts .btn{min-height:44px;padding:8px 12px;font-size:15px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ok-line{font-size:14px;color:var(--ok)}
/* דיאלוגים */
.dlg{border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-top:12px}
.dlg h3{margin:0 0 8px;font-size:17px}
.bub{display:flex;gap:8px;align-items:center;margin:8px 0}
.bub .b{flex:1;min-width:0;border-radius:14px;padding:8px 12px;background:var(--soft)}
.bub.you .b{background:var(--accent-soft)}
.bub .who{font-size:12px;color:var(--muted)}
.bub .gr{font-size:20px;display:block}
.bub .tr{display:block;font-size:13px}
.iconbtn{min-width:48px;min-height:48px;border:1px solid var(--line);background:var(--bg);border-radius:12px;font-size:20px;display:inline-flex;align-items:center;justify-content:center}

.btn{min-height:52px;padding:12px 18px;border-radius:var(--radius);border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.say{min-width:48px;min-height:48px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:20px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.say:active{background:var(--accent-soft)}

.card{border:1px solid var(--line);border-radius:var(--radius);padding:16px;background:var(--bg)}
.stack>*+*{margin-top:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}

/* מסך ראשי */
.chapnav{display:flex;align-items:center;gap:8px;margin:6px 0 4px}
.chapnav .mid{flex:1;text-align:center}
.chapnav .mid .k{font-size:13px;color:var(--muted)}
.chapnav .mid .t{font-size:21px;font-weight:700}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.intro{color:var(--muted);font-size:15px;margin:10px 0 16px}
.station{display:block}
.station .num{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;border:2px solid var(--line);flex:none}
.station.done .num{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.station.open .num{border-color:var(--accent);color:var(--accent)}
.station.locked,.station.soon{opacity:.62}
.station h3{margin:0;font-size:17px}
.station .sub{font-size:14px;color:var(--muted)}
.badge{font-size:13px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.badge.done{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.badge.open{border-color:var(--accent);color:var(--accent)}
.station .acts{display:flex;gap:8px;margin-top:12px}
.station .acts .btn{flex:1}

/* חידון */
.qtop{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);margin:4px 0 8px}
.qask{font-size:16px;color:var(--muted);text-align:center;margin:14px 0 6px}
.qprompt{text-align:center;margin:6px 0 18px;min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.qprompt .gr{font-size:46px;line-height:1.2;overflow-wrap:anywhere}
.qprompt .gr.long{font-size:30px}
.qprompt .lat{font-size:34px;font-weight:700}
.qprompt .he-big{font-size:26px;font-weight:700}
.listenbtn{width:96px;height:96px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-ink);font-size:38px}
.linkbtn{background:none;border:none;color:var(--accent);text-decoration:underline;font-size:14px;min-height:40px;padding:4px 8px}
.opts{display:grid;gap:10px}
.opt{min-height:58px;width:100%;padding:10px 14px;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--bg);font-size:18px;text-align:center;overflow-wrap:anywhere}
.opt .gr{font-size:24px}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default;color:var(--fg)}
.feedback{margin-top:14px;border-radius:var(--radius);padding:14px;border:1px solid var(--line)}
.feedback.ok{background:var(--ok-soft);border-color:transparent}
.feedback.bad{background:var(--bad-soft);border-color:transparent}
.feedback .h{font-weight:700;margin-bottom:4px}
.feedback .ok-t{color:var(--ok)} .feedback .bad-t{color:var(--bad)}
.big-num{font-size:52px;font-weight:800;color:var(--accent);text-align:center;line-height:1}
.stats{display:flex;gap:10px}
.stats>div{flex:1;text-align:center;border:1px solid var(--line);border-radius:12px;padding:10px}
.stats b{display:block;font-size:22px}
.missed-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.missed-item .gr{font-size:22px}

/* לימוד */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:42px;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-size:15px;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
table.tbl{width:100%;border-collapse:collapse;table-layout:fixed}
.tbl th{font-size:13px;color:var(--muted);font-weight:600;text-align:start;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 4px;border-bottom:1px solid var(--line);vertical-align:middle;overflow-wrap:anywhere}
.tbl td .gr{font-size:22px;display:block}
.tbl td.letter .gr{font-size:30px}
.tbl td.letter .gr.nm{font-size:15px;font-weight:500;margin-top:2px}
.legend ul{margin:6px 0 0;padding-inline-start:18px}
.tbl td .tr{display:block;font-size:13px}
.tbl .c-say{width:56px;text-align:center}
.legend{font-size:14px;color:var(--muted);background:var(--soft);border-radius:12px;padding:10px 12px;margin:10px 0}

/* שיחה */
.tabs{display:flex;border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin:6px 0 14px}
.tabs button{flex:1;min-height:46px;border:none;border-radius:9px;background:transparent;font-weight:600;font-size:15px}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.mic{width:120px;height:120px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-ink);font-size:46px;display:block;margin:10px auto}
.mic.rec{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}100%{box-shadow:0 0 0 22px transparent}}
.status{text-align:center;color:var(--muted);font-size:15px;min-height:24px}
.field{width:100%;min-height:52px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);font-size:17px}
textarea.field{min-height:80px;resize:vertical}
.result .gr.main{font-size:32px;display:block;line-height:1.3}
.result .tr.main{font-size:20px;display:block;margin-top:6px;color:var(--fg)}
.src{font-size:13px;color:var(--muted)}
.warn{font-size:14px;background:var(--bad-soft);border-radius:10px;padding:10px 12px}

/* אוצר מילים */
.vitem{display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.vitem .gr{font-size:22px;display:block}
.vitem .tr{display:block;font-size:13px}
.vhe{background:none;border:1px dashed var(--line);border-radius:10px;padding:8px 10px;min-height:44px;text-align:start;width:100%;margin-top:6px}
.vhe.empty{color:var(--bad)}
.del{min-width:44px;min-height:44px;border:none;background:none;color:var(--muted);font-size:20px}

nav.bottom{position:fixed;inset-inline:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.bottom .in{display:flex;width:100%;max-width:560px}
nav.bottom button{flex:1;min-height:64px;border:none;background:none;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav.bottom button .ic{font-size:22px;line-height:1}
nav.bottom button.on{color:var(--accent);font-weight:700}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;text-align:center}
.toast.show{opacity:1}
h2{font-size:20px;margin:8px 0 4px}
</style>

<script>
'use strict';
/* =========================================================
   תעתיק הגייה — יוונית מודרנית (כתיב סדיר → חוקים)
   ההברה המוטעמת באותיות גדולות. במילה של הברה אחת אין סימון.
   ========================================================= */
const VOW = 'αεηιουω';
const VOICED = 'βγδζλμνρ';
const DOUBLE = 'λμνστκπρ';
const SINGLE = {α:'a',ε:'e',η:'i',ι:'i',ο:'o',υ:'i',ω:'o'};
const CONS = {β:'v',δ:'dh',ζ:'z',θ:'th',κ:'k',λ:'l',μ:'m',ν:'n',ξ:'ks',π:'p',ρ:'r',τ:'t',φ:'f',χ:'h',ψ:'ps'};
const ONSETS = new Set([
  'p|l','p|r','b|l','b|r','f|l','f|r','v|l','v|r','t|r','d|r','dh|r','th|r','th|n',
  'k|l','k|r','k|n','k|t','g|l','g|r','gh|l','gh|r','gh|n','gh|dh','h|l','h|r','h|n',
  's|t','s|p','s|k','s|f','s|th','s|h','z|m','z|v','z|gh','m|n','p|t','p|n','f|t','f|th','v|dh',
  's|t|r','s|p|r','s|k|r','s|k|l','s|f|r'
]);
function splitChars(w){
  const out=[];
  for(const ch of w.toLowerCase().normalize('NFD')){
    if(ch==='́'){ if(out.length) out[out.length-1].acc=true; continue; }
    if(ch==='̈'){ if(out.length) out[out.length-1].dia=true; continue; }
    if(/[̀-ͯ]/.test(ch)) continue;
    out.push({c: ch==='ς'?'σ':ch, acc:false, dia:false});
  }
  return out;
}
const isV = x => !!x && VOW.includes(x.c);
function unitAt(ch,i){
  const a=ch[i], b=ch[i+1];
  if(!isV(a)) return null;
  if(b && !a.acc && !b.dia){
    if(a.c==='ο'&&b.c==='υ') return {len:2,snd:'u',acc:b.acc};
    if(b.c==='ι' && 'αεου'.includes(a.c)) return {len:2,snd:a.c==='α'?'e':'i',acc:b.acc};
    if(b.c==='υ' && 'αεη'.includes(a.c)) return {len:2,snd:SINGLE[a.c],acc:b.acc,au:true};
  }
  return {len:1,snd:SINGLE[a.c],acc:a.acc};
}
function wordTokens(w){
  const ch=splitChars(w), tk=[]; let i=0;
  const push=(t,v,o)=>tk.push(Object.assign({t,v},o||{}));
  while(i<ch.length){
    const a=ch[i], b=ch[i+1];
    if(isV(a)){
      const u=unitAt(ch,i);
      if(u.au){ // αυ / ευ / ηυ → av/af, ev/ef, iv/if
        push(u.snd,true,{acc:u.acc});
        const nx=ch[i+2];
        const voiced = nx && (isV(nx)||VOICED.includes(nx.c));
        push(voiced?'v':'f',false,{stick: !!nx && !isV(nx)});
        i+=2; continue;
      }
      // ι לא מוטעמת בין עיצור לתנועה מוטעמת → y (πιάτο → PYAto)
      if(u.len===1 && a.c==='ι' && !a.acc && !a.dia && tk.length && !tk[tk.length-1].v){
        const nu=unitAt(ch,i+1);
        if(nu && nu.acc && nu.snd!=='i'){ push('y',false,{glide:true}); i+=1; continue; }
      }
      push(u.snd,true,{acc:u.acc}); i+=u.len; continue;
    }
    const c=a.c, n=b&&b.c, first=tk.length===0;
    if(c==='γ'){
      if(n==='γ' && ch[i+2] && ch[i+2].c==='ν'){ push('gh',false); i+=2; continue; } // συγγνώμη → siGHNOmi
      if(n==='γ'){ push('n',false,{stick:true}); push('g',false); i+=2; continue; }
      if(n==='κ'){ if(first) push('g',false); else { push('n',false,{stick:true}); push('g',false); } i+=2; continue; }
      if(n==='χ'){ push('n',false,{stick:true}); push('h',false); i+=2; continue; }
      if(n==='ξ'){ push('n',false,{stick:true}); push('ks',false); i+=2; continue; }
      const nu=unitAt(ch,i+1);
      if(nu && (nu.snd==='i'||nu.snd==='e')){
        if(nu.snd==='i' && !nu.acc && !nu.au && isV(ch[i+1+nu.len])){ push('y',false); i+=1+nu.len; continue; } // για, γεια
        push('y',false); i+=1; continue;
      }
      push('gh',false); i+=1; continue;
    }
    if(c==='μ'&&n==='π'){ if(first) push('b',false); else { push('m',false,{stick:true}); push('b',false); } i+=2; continue; }
    if(c==='ν'&&n==='τ'){ if(first) push('d',false); else { push('n',false,{stick:true}); push('d',false); } i+=2; continue; }
    if(c==='τ'&&n==='σ'){ push('ts',false); i+=2; continue; }
    if(c==='τ'&&n==='ζ'){ push('dz',false); i+=2; continue; }
    if(n===c && DOUBLE.includes(c)){ i+=1; continue; }
    if(c==='σ'){ push((n && 'βγδμν'.includes(n))?'z':'s',false); i++; continue; }
    if(CONS[c]){ push(CONS[c],false); i++; continue; }
    push(c,false,{raw:true}); i++;
  }
  return tk;
}
function legalOnset(cs){
  if(!cs.length) return true;
  if(cs[cs.length-1].glide) return cs.length===1 || legalOnset(cs.slice(0,-1));
  if(cs.some(t=>t.stick)) return false;
  if(cs.length===1) return true;
  return ONSETS.has(cs.map(t=>t.t).join('|'));
}
function onsetLen(cs){ for(let L=Math.min(cs.length,4);L>0;L--) if(legalOnset(cs.slice(-L))) return L; return 0; }
function trWord(w){
  const tk=wordTokens(w);
  if(!tk.length || tk.some(t=>t.raw)) return w;
  const j=a=>a.map(t=>t.t).join('');
  const vi=tk.map((t,i)=>t.v?i:-1).filter(i=>i>=0);
  const k=tk.findIndex(t=>t.v&&t.acc);
  if(vi.length<2 || k<0) return j(tk);
  const p=vi.indexOf(k);
  const s = p===0 ? 0 : k-onsetLen(tk.slice(vi[p-1]+1,k));
  const e = p===vi.length-1 ? tk.length : vi[p+1]-onsetLen(tk.slice(k+1,vi[p+1]));
  return j(tk.slice(0,s)) + j(tk.slice(s,e)).toUpperCase() + j(tk.slice(e));
}
function translit(text){
  return String(text)
    .replace(/[Ͱ-Ͽἀ-῿][Ͱ-Ͽἀ-῿̀-ͯ]*/g, w=>trWord(w))
    .replace(/[;;]/g,'?').replace(/·/g,';');
}

/* ===================== נרמול להשוואות ===================== */
const normGr = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/ς/g,'σ').replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
const normHe = s => String(s||'').replace(/[֑-ׇ]/g,'').replace(/\([^)]*\)/g,' ').replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
const normLat = s => String(s||'').toLowerCase().replace(/[^a-z]/g,'');
const FIN = {'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'};
function heKeys(he){
  const base = String(he).replace(/\([^)]*\)/g,' ');
  const masc = base.replace(/(\S+?)\/(ה|ת|ית)(?=\s|$|[?!.,])/g,'$1');
  const fem  = base.replace(/(\S+?)\/(ה|ת|ית)(?=\s|$|[?!.,])/g,(m,a,suf)=>{ const last=a.slice(-1); return (FIN[last]? a.slice(0,-1)+FIN[last] : a)+suf; });
  return [...new Set([normHe(base.replace(/\//g,' ')),normHe(masc),normHe(fem)])].filter(Boolean);
}

/* ===================== תוכן =====================
   נבחר לפי התשובות: אפס מוחלט; כבר מכיר/ה ברכות, תודה/בבקשה, כן/לא
   (לכן אין עליהן תחנה — הן מופיעות רק כתרגול קריאה בתחנה 3);
   דחוף: טברנות, קניות, תחבורה, חירום; אישי: קפיצה בין איים, רכב/טרקטורון, צימרים. */
const CHAPTERS = [
  {n:1, t:'מתחילים לקרוא', intro:'יוונית נכתבת באלפבית משלה — 24 אותיות. בפרק הזה לומדים לזהות את כולן ואת הצירופים החשובים, כדי לקרוא שלטים, תפריטים ושמות של איים.'},
  {n:2, t:'שפה שימושית ליום-יום', intro:'מה שצריך בטברנה, בשוק, בנמל ועל הכביש עם הרכב או הטרקטורון.'},
  {n:3, t:'מתחילים לדבר', intro:'משפטים להגיד בעצמך — בצימר, כשצריך עזרה, בשיחת חולין, ובסוף ארבעה דיאלוגים שלמים.'}
];
const L = (gr,name,snd,sndHe,desc,ex,exHe,note) => ({kind:'letter',gr,name,snd,sndHe,desc,ex,exHe,note});
const C = (gr,snd,sndHe,desc,ex,exHe,note) => ({kind:'combo',gr,snd,sndHe,desc,ex,exHe,note});
const W = (gr,he,note) => ({kind:'word',gr,he,note});

const STATIONS = [
 {id:1, ch:1, title:'אותיות א׳: Α עד Μ', sub:'12 האותיות הראשונות — צורה, שם וצליל', mode:'letters', items:[
  L('Α α','άλφα','a','אַ','a כמו אַ','Αθήνα','אתונה'),
  L('Β β','βήτα','v','ו','v — כמו ו׳ (ב׳ רפה), לא b','βανίλια','וניל','הצליל b נכתב ביוונית μπ — בתחנה 3.'),
  L('Γ γ','γάμμα','gh / y','ר רכה / י','לפני a, o, u: ר׳ רכה וגרונית (gh); לפני e, i: כמו י׳','γάλα','חלב','במילה γεια שמכירים — γ נשמעת י׳: ya.'),
  L('Δ δ','δέλτα','dh','ד׳ רכה','dh — כמו th באנגלית this, לא d','Δελφοί','דלפי','הצליל d נכתב ביוונית ντ — בתחנה 3.'),
  L('Ε ε','έψιλον','e','אֶ','e כמו אֶ','Ελλάδα','יוון'),
  L('Ζ ζ','ζήτα','z','ז','z כמו ז׳','Ζάκυνθος','זקינתוס'),
  L('Η η','ήτα','i','אִי','i כמו אִי — לא h!','Ηράκλειο','הרקליון (כרתים)','שלוש אותיות נשמעות i: Η, Ι, Υ.'),
  L('Θ θ','θήτα','th','ת׳ (think)','th — כמו th באנגלית think','Θεσσαλονίκη','סלוניקי'),
  L('Ι ι','γιώτα','i','אִי','i כמו אִי','Ιθάκη','איתקה','שלוש אותיות נשמעות i: Η, Ι, Υ.'),
  L('Κ κ','κάπα','k','ק','k כמו ק׳','Κρήτη','כרתים'),
  L('Λ λ','λάμδα','l','ל','l כמו ל׳','λεμόνι','לימון'),
  L('Μ μ','μι','m','מ','m כמו מ׳','Μύκονος','מיקונוס')
 ]},
 {id:2, ch:1, title:'אותיות ב׳: Ν עד Ω', sub:'12 האותיות האחרונות, כולל הסוף ς', mode:'letters', items:[
  L('Ν ν','νι','n','נ','n כמו נ׳','Νάξος','נקסוס','ν הקטנה נראית כמו v — אבל היא n.'),
  L('Ξ ξ','ξι','ks','קס','ks — אות אחת לשני צלילים','ταξί','מונית'),
  L('Ο ο','όμικρον','o','אוֹ','o כמו אוֹ','Όλυμπος','אולימפוס','Ο ו-Ω נשמעות בדיוק אותו דבר.'),
  L('Π π','πι','p','פּ','p כמו פּ׳ דגושה','Πάρος','פארוס'),
  L('Ρ ρ','ρο','r','ר מתגלגלת','r — ר׳ מתגלגלת בקצה הלשון','Ρόδος','רודוס','נראית כמו P לטינית — אבל היא r.'),
  L('Σ σ ς','σίγμα','s','ס','s כמו ס׳. בסוף מילה כותבים ς','σαλάτα','סלט'),
  L('Τ τ','ταυ','t','ט','t כמו ט׳','ταβέρνα','טברנה'),
  L('Υ υ','ύψιλον','i','אִי','i כמו אִי','Ύδρα','הידרה','נראית כמו Y — אבל נשמעת i.'),
  L('Φ φ','φι','f','פ רפה','f כמו פ׳ רפה','φέτα','גבינת פטה'),
  L('Χ χ','χι','h','ח','h — כמו ח׳; לפני e, i רכה יותר','χαλβάς','חלווה','נראית כמו X — אבל נשמעת ח׳.'),
  L('Ψ ψ','ψι','ps','פס','ps — אות אחת לשני צלילים','ψωμί','לחם'),
  L('Ω ω','ωμέγα','o','אוֹ','o כמו אוֹ — בדיוק כמו Ο','ωραία','יפה, נהדר','Ο ו-Ω נשמעות בדיוק אותו דבר.')
 ]},
 {id:3, ch:1, title:'צירופים וקריאה ראשונה', sub:'שתי אותיות = צליל אחד, ומילים שכבר מכירים מהשמיעה', mode:'combos', items:[
  C('ου','u','אוּ','שתי אותיות, צליל אחד: u','ούζο','אוזו (משקה אניס)'),
  C('αι','e','אֶ','נשמע e — בדיוק כמו ε','και','וְ (ו׳ החיבור)'),
  C('ει','i','אִי','נשמע i','είναι','הוא / היא / זה (הפועל "להיות")'),
  C('οι','i','אִי','נשמע i','Οία','אויה (הכפר בסנטוריני)'),
  C('αυ','av / af','אָב / אָף','av לפני תנועה או עיצור קולי; af לפני עיצור אטום (τ, κ, π, θ, σ, φ, χ)','αύριο','מחר'),
  C('ευ','ev / ef','אֶב / אֶף','ev או ef — לפי אותו כלל כמו αυ','ευχαριστώ','תודה'),
  C('μπ','b','בּ','כך כותבים b (כי β היא v). באמצע מילה לפעמים mb','μπύρα','בירה'),
  C('ντ','d','ד','כך כותבים d (כי δ היא th רכה). באמצע מילה לפעמים nd','ντομάτα','עגבנייה'),
  C('γκ','g','ג','כך כותבים g. באמצע מילה לפעמים ng','γκαρσόνι','מלצר'),

const KEY='greek-trip-v1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function blankProfile(name){ return {id:uid(), name, photo:'', updated:Date.now(), deleted:false, best:{}, vocab:[], rounds:{}}; }
const liveProfiles=()=>Object.values(S.profiles).filter(p=>!p.deleted);
const P=()=>S.profiles[S.active];
const liveVocab=()=>P().vocab.filter(v=>!v.deleted);
let S;
function fixActive(){
  if(!S.profiles[S.active]||S.profiles[S.active].deleted){
    const a=liveProfiles()[0];
    if(a) S.active=a.id; else { const p=blankProfile('אני'); S.profiles[p.id]=p; S.active=p.id; }
  }
}
function loadState(){
  let raw=null; try{ raw=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
  if(raw && raw.v===2 && raw.profiles) S=raw;
  else { // הגירה מהגרסה הבסיסית: ההתקדמות והמילים עוברות לפרופיל "אני"
    const p=blankProfile('אני');
    if(raw){ p.best=raw.best||{}; p.vocab=(raw.vocab||[]).map(v=>({id:uid(),gr:v.gr,he:v.he||'',src:v.src||'',miss:v.miss||0,updated:v.t||Date.now(),deleted:false})); }
    S={v:2, theme:(raw&&raw.theme)||'light', ch:(raw&&raw.ch)||1, device:uid(), active:p.id, profiles:{[p.id]:p}, sync:{url:'',group:'',last:0,err:''}};
  }
  S.sync=S.sync||{url:'',group:'',last:0,err:''};
  if(!S.device) S.device=uid();
  fixActive(); persist();
}
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function save(){ persist(); scheduleSync(); }
loadState();

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// טקסט מעורב: כל רצף יווני או לטיני מבודד בנפרד
const MIXRE=/([Ͱ-Ͽἀ-῿][Ͱ-Ͽἀ-῿̀-ͯ]*(?:[ ,-]+[Ͱ-Ͽἀ-῿][Ͱ-Ͽἀ-῿̀-ͯ]*)*)|([A-Za-z0-9](?:[A-Za-z0-9 ,/-]*[A-Za-z0-9])?)/g;
function mix(t){
  t=String(t==null?'':t); let out='', last=0, m;
  MIXRE.lastIndex=0;
  while((m=MIXRE.exec(t))){
    out+=esc(t.slice(last,m.index));
    out+= m[1] ? `<span class="gr" lang="el" dir="ltr">${esc(m[0])}</span>` : `<span class="lat" dir="ltr">${esc(m[0])}</span>`;
    last=m.index+m[0].length;
  }
  return out+esc(t.slice(last));
}
const G=(t,cls)=>`<span class="gr ${cls||''}" lang="el" dir="ltr">${esc(t)}</span>`;
const T=t=>`<span class="tr" dir="ltr">${esc(t)}</span>`;
const LAT=t=>`<span class="lat" dir="ltr">${esc(t)}</span>`;
const SAY=(t,label)=>`<button class="say" data-say="${esc(t)}" aria-label="${esc(label||'השמע')}">🔊</button>`;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }

/* ===================== הקראה — רק מלחיצה ===================== */
let grVoice=null, voicesReady=false;
function loadVoices(){
  try{ const vs=speechSynthesis.getVoices(); if(vs.length){ voicesReady=true; grVoice=vs.find(v=>/^el([-_]|$)/i.test(v.lang))||null; } }catch(e){}
}
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function speak(text){
  if(!('speechSynthesis' in window)){ toast('הדפדפן הזה לא תומך בהקראה'); return; }
  const ss=window.speechSynthesis;
  try{ if(ss.speaking||ss.pending) ss.cancel(); if(ss.paused) ss.resume(); }catch(e){}
  if(!voicesReady) loadVoices();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='el-GR'; if(grVoice) u.voice=grVoice; u.rate=0.85;
  u.onerror=e=>{ if(e.error!=='interrupted'&&e.error!=='canceled') toast('ההקראה נכשלה ('+e.error+')'); };
  ss.speak(u);
}

/* ===================== סטטוס תחנות ===================== */
const station=id=>STATIONS.find(s=>s.id===id);
const best=(id,p)=>((p||P()).best[id])||0;
function isOpen(id){
  const st=station(id); if(!st||st.soon) return false;
  if(id===1) return true;
  const prev=station(id-1); return !!prev && !prev.soon && best(id-1)>=75;
}
function status(st){ if(st.soon) return 'soon'; if(best(st.id)>=75) return 'done'; return isOpen(st.id)?'open':'locked'; }

function vocabItems(){
  return liveVocab().filter(v=>v.gr && v.he).map(v=>({kind:'word',gr:v.gr,he:v.he,tr:translit(v.gr),id:'v'+v.id,vid:v.id,personal:true,note:'מהמילים שלך ⭐'}));
}
function addVocab(gr,he,src){
  gr=String(gr||'').trim(); he=String(he||'').trim();
  if(!gr) return false;
  const V=P().vocab, now=Date.now();
  const ex=V.find(v=>normGr(v.gr)===normGr(gr));
  if(ex && !ex.deleted){ if(he && !ex.he){ ex.he=he; ex.updated=now; save(); } toast('כבר נמצא ברשימה שלך'); return false; }
  if(ex){ Object.assign(ex,{gr,he,src,deleted:false,updated:now}); V.splice(V.indexOf(ex),1); V.unshift(ex); }
  else V.unshift({id:uid(), gr, he, src, miss:0, updated:now, deleted:false});
  save(); toast('נשמר למילים שלי ⭐'); return true;
}

  listen:{P:['tr','gr'],A:'he', ask:()=>'הקשב/י — מה פירוש מה ששמעת?',audio:'gr'},
  // דיאלוג: מה עונים? מסיחים רק מתשובות של שיחות אחרות, ולא תשובות כלליות כמו "Ορίστε" שמתאימות כמעט לכל דבר
  reply: {P:['gr'], A:'ans', ask:()=>'אמרו לך את זה. מה מתאים לענות?', filter:(d,it)=>d.dlg!==it.dlg && !d.generic}
};
const NORM={gr:normGr,ex:normGr,ans:normGr,he:normHe,exHe:normHe,tr:normLat,exTr:normLat,snd:normLat};
function typesFor(it,mode){
  if(it.kind==='letter') return ['l2s','s2l','exRead','exListen','exMean'];
  if(it.kind==='combo') return ['l2s','s2l','exRead','exListen'];
  if(it.kind==='pair') return ['reply'];
  if(mode==='combos') return ['g2t','g2h','listenG'];
  if(it.role==='they') return ['listen','g2h'];   // מה שאומרים לך: להבין
  if(it.role==='you') return ['h2g','g2t'];       // מה שאת/ה אומר/ת: להגיד ולהגות
  return ['g2h','h2g','g2t','listen'];
}
function makeQ(item,type,cands){
  const q=QT[type], nA=NORM[q.A];
  const used=new Set([nA(item[q.A])]);
  const ds=[];
  for(const d of shuffle(cands)){
    if(d===item || d.kind!==item.kind) continue;
    if(q.filter && !q.filter(d,item)) continue;
    if(q.P.some(f=>NORM[f](d[f])===NORM[f](item[f]))) continue; // לא עוד תשובה נכונה
    const a=nA(d[q.A]); if(!a||used.has(a)) continue;
    used.add(a); ds.push(d); if(ds.length===3) break;
  }
  if(ds.length<3) return null;
  return {item,type,options:shuffle([item,...ds]),answer:null};
}
function roundPool(st){
  let pool=st.items.slice();
  let pick;
  if(st.mode==='combos'){
    const cm=shuffle(pool.filter(i=>i.kind==='combo')), wd=shuffle(pool.filter(i=>i.kind==='word'));
    pick=[...cm.slice(0,7),...wd.slice(0,12-Math.min(7,cm.length))];
  } else if(st.mode==='vocab'){
    const have=new Set(pool.map(i=>normGr(i.gr)));
    const mine=vocabItems().filter(v=>!have.has(normGr(v.gr)));
    const missOf=v=>(P().vocab.find(x=>x.id===v.vid)||{}).miss||0;
    const mineSorted=shuffle(mine).sort((a,b)=>missOf(b)-missOf(a)).slice(0,3);
    pool=pool.concat(mine); // מסיחים גם מהמילים שלך
    pick=[...mineSorted,...shuffle(st.items).slice(0,12-mineSorted.length)];
  } else if(st.mode==='dialog'){
    const pairs=shuffle(pool.filter(i=>i.kind==='pair')).slice(0,6);
    const taken=new Set(pairs.flatMap(p=>[normGr(p.gr),normGr(p.ans)])); // אותו משפט לא יופיע פעמיים בסיבוב
    const lines=shuffle(pool.filter(i=>i.kind==='word' && !taken.has(normGr(i.gr))));
    pick=[...pairs,...lines.slice(0,12-pairs.length)];
  } else pick=shuffle(pool).slice(0,12);
  return {pool,pick:shuffle(pick)};
}
function buildRound(id){
  const st=station(id);
  const {pool,pick}=roundPool(st);
  const qs=[];
  for(const it of pick){
    for(const t of shuffle(typesFor(it,st.mode))){ const q=makeQ(it,t,pool); if(q){ qs.push(q); break; } }
  }
  return qs.slice(0,12); // מאגר קטן → סיבוב קצר, בלי חזרות
}
let R=null;
function startRound(id){
  const st=station(id);
  if(!st || !isOpen(id)){ toast(st&&st.soon?'התחנה הזאת עוד לא זמינה':'התחנה נעולה — קודם השלם/י את הקודמת ב-75%'); return false; }
  R={sid:id, qs:buildRound(id), i:0, score:0, streak:0, bestStreak:0, missed:[], revealed:false};
  go('quiz'); return true;
}
function optLabel(it,f){
  if(f==='snd') return `${LAT(it.snd)} <span class="muted">· ${esc(it.sndHe)}</span>`;
  if(f==='gr'||f==='ex'||f==='ans') return G(it[f]);
  if(f==='tr'||f==='exTr') return LAT(it[f]);
  return `<span class="he">${esc(it[f])}</span>`;
}
function promptHTML(q){
  const it=q.item, qt=QT[q.type];
  if(qt.audio){
    const text=it[qt.audio];
    return `<button class="listenbtn" data-say="${esc(text)}" aria-label="השמע">🔊</button>
      ${R.revealed?`<div>${G(text,text.length>14?'long':'')}</div>`:`<button class="linkbtn" data-act="reveal">אין קול? הצג את הטקסט</button>`}`;
  }
  if(q.type==='reply') return `<div>${G(it.gr,'long')}</div>${SAY(it.gr)}`;
  if(q.type==='s2l') return `<div class="lat">${esc(it.snd)}</div><div class="muted">${mix(it.desc)}</div>`;
  if(q.type==='h2g') return `<div class="he-big">${esc(it.he)}</div>`;
  const text = (q.type==='exRead'||q.type==='exMean') ? it.ex : it.gr;
  return `<div>${G(text, text.length>14?'long':'')}</div>`;
}
function sameSound(it){
  const st=station(it.sid); if(!st||!it.snd) return '';
  const o=st.items.filter(x=>x!==it && x.snd===it.snd).map(x=>x.gr);
  return o.length?`שימו לב: גם ${o.map(x=>G(x)).join(' ו-')} נשמע${o.length>1?'ות':''} ${LAT(it.snd)}. `:'';
}
function explain(q){
  const it=q.item;
  if(it.kind==='letter'||it.kind==='combo'){
    const head = it.kind==='letter'
      ? `${G(it.gr)} — שמה ${G(it.name)} ${T(it.nameTr)}. הצליל: ${LAT(it.snd)} — ${mix(it.desc)}.`
      : `${G(it.gr)} = ${LAT(it.snd)} — ${mix(it.desc)}.`;
    return `${head}<br>דוגמה: ${G(it.ex)} ${T(it.exTr)} — ${esc(it.exHe)} ${SAY(it.ex)}<br>${sameSound(it)}${it.note?mix(it.note):''}`;
  }
  if(it.kind==='pair') return `אמרו לך: ${G(it.gr)} ${T(it.tr)} — ${esc(it.he)}<br>עונים: ${G(it.ans)} ${SAY(it.ans)}<br>${T(it.ansTr)}<br><b>${esc(it.ansHe)}</b>`;
  return `${G(it.gr)} ${SAY(it.gr)}<br>${T(it.tr)}<br><b>${esc(it.he)}</b>${it.note?`<br><span class="muted">${mix(it.note)}</span>`:''}`;
}
function answer(idx){
  if(!R||R.revealedAnswer) return;
  const q=R.qs[R.i]; const ch=q.options[idx]; if(!ch) return;
  q.answer=idx; R.revealedAnswer=true; R.revealed=true;
  if(ch===q.item){ R.score++; R.streak++; R.bestStreak=Math.max(R.bestStreak,R.streak); }
  else {
    R.streak=0; R.missed.push(q);
    if(q.item.personal){ const v=P().vocab.find(x=>x.id===q.item.vid); if(v){ v.miss=(v.miss||0)+1; persist(); } }
  }
  render();
}
function nextQ(){
  if(!R||!R.revealedAnswer) return;
  R.i++; R.revealedAnswer=false; R.revealed=false;
  if(R.i>=R.qs.length) finishRound(); else render();
}
function finishRound(){
  const pct=Math.round(R.score/R.qs.length*100);
  const was=best(R.sid), nextWasOpen=isOpen(R.sid+1);
  if(pct>was) P().best[R.sid]=pct;
  const rc=(P().rounds=P().rounds||{}), mine=rc[S.device]||{n:0,c:0};
  rc[S.device]={n:mine.n+1, c:mine.c+R.score};
  save();
  R.pct=pct; R.unlocked = !nextWasOpen && isOpen(R.sid+1);
  R.done=true; go('result');
}
function saveableOf(it){ return it.kind==='word'?{gr:it.gr,he:it.he} : it.kind==='pair'?{gr:it.ans,he:it.ansHe} : {gr:it.ex,he:it.exHe}; }

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec=null, recOn=false, talkRes={hear:null,say:null}, talkBusy=false;
function allPhrases(){
  const out=[];
  STATIONS.forEach(st=>(st.items||[]).forEach(i=>{ if(i.kind==='word') out.push({gr:i.gr,he:i.he}); }));
  liveVocab().forEach(v=>{ if(v.gr&&v.he) out.push({gr:v.gr,he:v.he}); });
  return out;
}
function lookup(text,from){
  const all=allPhrases();
  if(from==='el'){ const k=normGr(text); return all.find(p=>normGr(p.gr)===k)||null; }
  const k=normHe(text); return all.find(p=>heKeys(p.he).includes(k))||null;
}
async function translate(text,from){
  const hit=lookup(text,from);
  if(hit) return {gr:hit.gr, he:hit.he, src:'db'};
  try{
    const ctrl=new AbortController(); const tm=setTimeout(()=>ctrl.abort(),9000);
    const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+(from==='el'?'el|he':'he|el');
    const r=await fetch(url,{signal:ctrl.signal}); clearTimeout(tm);
    const j=await r.json();
    let t=j&&j.responseData&&j.responseData.translatedText;
    if(r.ok && Number(j.responseStatus)===200 && t){
      t=String(t).trim();
      const want = from==='el' ? /[֐-׿]/ : /[Ͱ-Ͽ]/;
      if(want.test(t) && !/MYMEMORY|QUERY LENGTH|INVALID/i.test(t)){
        return from==='el' ? {gr:text, he:t, src:'mt'} : {gr:t, he:text, src:'mt'};
      }
    }
  }catch(e){}
  return from==='el' ? {gr:text, he:'', src:'fail'} : {gr:'', he:text, src:'fail'};
}
function srcLabel(r){
  if(r.src==='db') return '✓ מהמאגר של המשחק';
  if(r.src==='mt') return '⚠️ תרגום מכונה (MyMemory) — לא מהמאגר, ייתכנו טעויות';
  return '';
}

async function doTranslate(text){
  text=String(text||'').trim(); if(!text) { toast('אין טקסט לתרגם'); return; }
  const from= talkTab==='hear'?'el':'he';
  talkBusy=true; talkRes[talkTab]=null; render();
  const r=await translate(text,from);
  talkBusy=false; talkRes[talkTab]=r; if(VIEW==='talk') render();
}
function toggleMic(){
  if(!SR){ toast('אין זיהוי דיבור בדפדפן הזה'); return; }
  if(recOn && rec){ try{rec.stop();}catch(e){} return; }
  rec=new SR(); rec.lang= talkTab==='hear'?'el-GR':'he-IL'; rec.interimResults=false; rec.maxAlternatives=1;
  rec.onresult=e=>{ const t=e.results[0][0].transcript; doTranslate(t); };
  rec.onerror=e=>{
    const m={'not-allowed':'אין הרשאה למיקרופון. בקובץ מקומי הדפדפן עלול לחסום — אפשר להקליד במקום.','service-not-allowed':'אין הרשאה למיקרופון.','no-speech':'לא נשמע דיבור — נסו שוב, קרוב יותר.','network':'זיהוי הדיבור דורש אינטרנט.','audio-capture':'לא נמצא מיקרופון.'};
    toast(m[e.error]||('שגיאה בזיהוי דיבור: '+e.error));
  };
  rec.onend=()=>{ recOn=false; if(VIEW==='talk') render(); };
  try{ rec.start(); recOn=true; render(); }catch(e){ toast('לא הצלחתי להפעיל את המיקרופון'); }
}

function loadPhoto(file,cb){
  const url=URL.createObjectURL(file), img=new Image();
  img.onload=()=>{ const s=Math.min(img.width,img.height), c=document.createElement('canvas'); c.width=c.height=128;
    c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,128,128); URL.revokeObjectURL(url); cb(c.toDataURL('image/jpeg',0.82)); };
  img.onerror=()=>{ URL.revokeObjectURL(url); toast('לא הצלחתי לקרוא את התמונה'); };
  img.src=url;
}
document.addEventListener('change',e=>{
  const pid=e.target && e.target.dataset && e.target.dataset.photo;
  if(!pid || !e.target.files || !e.target.files[0]) return;
  loadPhoto(e.target.files[0], data=>{ const p=S.profiles[pid]; if(!p) return; p.photo=data; p.updated=Date.now(); save(); render(); toast('התמונה נשמרה'); });
});

/* ===================== סנכרון בין מכשירים =====================
   כל מכשיר שולח את כל המצב שלו; השרת ממזג ולא דורס:
   ציון = המקסימום, מילים = לפי זמן עריכה (כולל סימון מחיקה), סיבובים = מונה נפרד לכל מכשיר.
   הלקוח ממזג את התשובה באותם כללים — כך סיבוב שנשחק במכשיר אחד לא נמחק ע"י מכשיר שלא התעדכן. */
const GROUP_RE=/^[A-Z0-9]{4}-[A-Z0-9]{4}$/;
function newGroup(){ const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; const r=new Uint32Array(8); crypto.getRandomValues(r); r.forEach((x,i)=>{ s+=a[x%a.length]; if(i===3) s+='-'; }); return s; }
function setSync(url,group){
  url=String(url||'').trim().replace(/\/+$/,''); group=String(group||'').trim().toUpperCase();
  if(!/^https:\/\/[^\s]+$/.test(url)){ toast('כתובת השרת צריכה להתחיל ב-https://'); return false; }
  if(!GROUP_RE.test(group)){ toast('קוד קבוצה בפורמט ABCD-1234'); return false; }
  S.sync={url,group,last:0,err:''}; persist(); render(); syncNow(true); return true;
}
let syncT=null, syncing=false;
function scheduleSync(){ if(!S.sync||!S.sync.url||!S.sync.group) return; clearTimeout(syncT); syncT=setTimeout(()=>syncNow(false),2500); }
function syncBody(){
  const b={group:S.sync.group, profiles:[], best:[], vocab:[], counters:[]};
  for(const p of Object.values(S.profiles)){
    b.profiles.push({id:p.id,name:p.name,photo:p.photo||'',updated:p.updated||0,deleted:p.deleted?1:0});
    for(const [st,pct] of Object.entries(p.best||{})) b.best.push({pid:p.id,station:Number(st),pct});
    for(const v of p.vocab||[]) b.vocab.push({pid:p.id,id:v.id,gr:v.gr,he:v.he||'',src:v.src||'',miss:v.miss||0,updated:v.updated||0,deleted:v.deleted?1:0});
    for(const [d,c] of Object.entries(p.rounds||{})) b.counters.push({pid:p.id,device:d,rounds:c.n||0,correct:c.c||0});
  }
  return b;
}
function mergeRemote(j){
  for(const p of j.profiles||[]){
    let L=S.profiles[p.id];
    if(!L) S.profiles[p.id]={id:p.id,name:p.name,photo:p.photo||'',updated:p.updated,deleted:!!p.deleted,best:{},vocab:[],rounds:{}};
    else if(p.updated>(L.updated||0)) Object.assign(L,{name:p.name,photo:p.photo||'',updated:p.updated,deleted:!!p.deleted});
  }
  for(const x of j.best||[]){ const L=S.profiles[x.pid]; if(L) L.best[x.station]=Math.max(L.best[x.station]||0, x.pct); }
  for(const v of j.vocab||[]){
    const L=S.profiles[v.pid]; if(!L) continue;
    const x=L.vocab.find(y=>y.id===v.id);
    if(!x) L.vocab.push({id:v.id,gr:v.gr,he:v.he||'',src:v.src||'',miss:v.miss||0,updated:v.updated,deleted:!!v.deleted});
    else { if(v.updated>(x.updated||0)) Object.assign(x,{gr:v.gr,he:v.he||'',src:v.src||'',updated:v.updated,deleted:!!v.deleted}); x.miss=Math.max(x.miss||0,v.miss||0); }
  }
  for(const c of j.counters||[]){
    const L=S.profiles[c.pid]; if(!L) continue; L.rounds=L.rounds||{};
    const x=L.rounds[c.device]||{n:0,c:0}; L.rounds[c.device]={n:Math.max(x.n,c.rounds), c:Math.max(x.c,c.correct)};
  }
  fixActive();
}
async function syncNow(manual){
  if(!S.sync.url||!S.sync.group){ if(manual) toast('הסנכרון לא מוגדר'); return false; }
  if(syncing) return false; syncing=true;
  let ok=false;
  try{
    const ctrl=new AbortController(); const tm=setTimeout(()=>ctrl.abort(),15000);
    const r=await fetch(S.sync.url+'/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(syncBody()),signal:ctrl.signal});
    clearTimeout(tm);
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
    mergeRemote(j); S.sync.last=Date.now(); S.sync.err=''; ok=true;
    if(manual) toast('סונכרן ✓');
  }catch(e){ S.sync.err=String(e&&e.message||e); if(manual) toast('הסנכרון נכשל: '+S.sync.err); }
  syncing=false; persist();
  if(VIEW==='home'||VIEW==='people') render();
  return ok;
}
function inviteLink(){
  if(!/^https?:/.test(location.protocol)) return '';
  return location.origin+location.pathname+'#join='+encodeURIComponent(S.sync.url)+'&g='+encodeURIComponent(S.sync.group);
}
async function shareInvite(){
  const link=inviteLink();
  const text = link || `כתובת שרת: ${S.sync.url}\nקוד קבוצה: ${S.sync.group}`;
  try{ if(navigator.share){ await navigator.share({title:'יוונית לטיול',text:'בואו ללמוד יוונית איתי',url:link||undefined}); return; } }catch(e){ return; }
  try{ await navigator.clipboard.writeText(text); toast('הועתק — שלחו למי שמצטרף/ת'); }catch(e){ prompt('העתיקו ושלחו:',text); }
}
function checkJoin(){
  const m=location.hash.match(/^#join=([^&]+)&g=([A-Z0-9-]+)/i);
  if(!m) return;
  history.replaceState(null,'',location.pathname+location.search);
  const url=decodeURIComponent(m[1]), g=decodeURIComponent(m[2]).toUpperCase();
  if(S.sync.url===url && S.sync.group===g) return;
  if(confirm('להצטרף לקבוצת הלימוד '+g+'? ההתקדמות שלך תסונכרן עם שאר הקבוצה.')) setSync(url,g);
}

  $('#themeBtn').textContent = S.theme==='dark'?'☀️':'🌙';
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme', S.theme==='dark'?'dark':'light');
  const m=document.querySelector('meta[name=theme-color]'); if(m) m.content = S.theme==='dark'?'#0f1115':'#ffffff';
}
document.addEventListener('click',e=>{
  const sayB=e.target.closest('[data-say]');
  if(sayB){ speak(sayB.dataset.say); return; }
  const nav=e.target.closest('[data-nav]');
  if(nav){ if(recOn&&rec) try{rec.stop();}catch(_){} go(nav.dataset.nav); return; }
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, sid=b.dataset.sid;
  switch(a){
    case 'ch': S.ch=Math.min(3,Math.max(1,S.ch+Number(b.dataset.d))); save(); render(); break;
    case 'start': startRound(Number(sid)); break;
    case 'peek': studySel=Number(sid); go('study'); break;
    case 'ans': answer(Number(b.dataset.i)); break;
    case 'next': nextQ(); break;
    case 'reveal': R.revealed=true; render(); break;
    case 'quit': R=null; go('home'); break;
    case 'home': go('home'); break;
    case 'savemiss': { const q=R.missed[Number(b.dataset.i)]; const sv=saveableOf(q.item); addVocab(sv.gr,sv.he,'מטעות בתחנה '+R.sid); break; }
    case 'studysel': studySel = sid==='mine'?'mine':Number(sid); render(); break;
    case 'tab': talkTab=b.dataset.t; if(recOn&&rec) try{rec.stop();}catch(_){} render(); break;
    case 'mic': toggleMic(); break;
    case 'translate': doTranslate(($('#talkIn')||{}).value); break;
    case 'savetalk': { const r=talkRes[talkTab]; if(r&&r.gr) addVocab(r.gr, r.src==='fail'?'':r.he, 'משיחה'); break; }
    case 'vadd': { const g=$('#vgr').value, h=$('#vhe').value; if(!g.trim()){toast('כתבו מילה ביוונית');break;} if(addVocab(g,h,'ידני')) render(); break; }
    case 'vedit': { editing=b.dataset.id; render(); const inp=$('#vedit'); if(inp) inp.focus(); break; }
    case 'vsave': { const v=P().vocab.find(x=>x.id===b.dataset.id); if(v){ v.he=$('#vedit').value.trim(); v.updated=Date.now(); save(); } editing=null; render(); break; }
    case 'vdel': { const v=P().vocab.find(x=>x.id===b.dataset.id); if(v && confirm('למחוק את '+v.gr+'?')){ v.deleted=true; v.updated=Date.now(); save(); render(); } break; }
    // לומדים
    case 'padd': { const n=($('#pname').value||'').trim(); if(!n){ toast('כתבו שם'); break; } const p=blankProfile(n.slice(0,30)); S.profiles[p.id]=p; save(); render(); toast('נוסף/ה: '+p.name); break; }
    case 'pswitch': { S.active=b.dataset.id; save(); R=null; render(); toast('משחק/ת עכשיו: '+P().name); break; }
    case 'pren': { const p=S.profiles[b.dataset.id]; const n=prompt('שם חדש', p.name); if(n&&n.trim()){ p.name=n.trim().slice(0,30); p.updated=Date.now(); save(); render(); } break; }
    case 'pphotodel': { const p=S.profiles[b.dataset.id]; p.photo=''; p.updated=Date.now(); save(); render(); break; }
    case 'pdel': { const p=S.profiles[b.dataset.id]; if(liveProfiles().length<2){ toast('צריך לפחות לומד/ת אחד/ת'); break; } if(confirm('למחוק את '+p.name+' וכל ההתקדמות שלו/ה?')){ p.deleted=true; p.updated=Date.now(); fixActive(); save(); render(); } break; }
    // סנכרון
    case 'snew': { const g=newGroup(); $('#sgroup').value=g; break; }
    case 'ssave': { setSync($('#surl').value, $('#sgroup').value); break; }
    case 'snow': syncNow(true); break;
    case 'sshare': shareInvite(); break;
    case 'soff': { S.sync={url:'',group:'',last:0,err:''}; persist(); render(); toast('הסנכרון כובה במכשיר הזה'); break; }
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter' && e.target && e.target.id==='talkIn' && e.target.tagName==='INPUT'){ doTranslate(e.target.value); }
  if(e.key==='Enter' && e.target && e.target.id==='vedit'){ const btn=document.querySelector('[data-act=vsave]'); if(btn) btn.click(); }
});
$('#themeBtn').addEventListener('click',()=>{ S.theme = S.theme==='dark'?'light':'dark'; save(); applyTheme(); render(); });
applyTheme(); render();
checkJoin();
if(S.sync.url&&S.sync.group) syncNow(false);
addEventListener('online',()=>scheduleSync());
// כשהדף מוגש מאתר (לא מקובץ מקומי): התקנה כאפליקציה ועבודה בלי אינטרנט
if(/^https?:$/.test(location.protocol) && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)){
  const l=document.createElement('link'); l.rel='manifest'; l.href='manifest.webmanifest'; document.head.appendChild(l);
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
}

// לבדיקות בלבד
window.__app={STATIONS,DIALOGS,QT,NORM,buildRound,startRound,answer,nextQ,isOpen,status,translit,heKeys,lookup,mergeRemote,syncBody,syncNow,setSync,ranked,
  get R(){return R;},get S(){return S;},
  reset(){ try{localStorage.removeItem(KEY);}catch(e){} loadState(); R=null; applyTheme(); go('home'); }};
